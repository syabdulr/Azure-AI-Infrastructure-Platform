name: Deploy to Production

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment:
      name: staging
      url: https://staging.example.com
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set lowercase image name
        # GitHub Actions expressions have no tolower() function; ghcr.io
        # requires a lowercase image name, so compute it in the shell.
        run: echo "IMAGE_NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull latest image
        run: |
          # Retry: docker-build.yml runs concurrently on the same push and
          # may not have finished pushing :latest yet.
          MAX_ATTEMPTS=10
          ATTEMPT=0
          until docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest; do
            ATTEMPT=$((ATTEMPT + 1))
            if [ $ATTEMPT -ge $MAX_ATTEMPTS ]; then
              echo "Image not available after $MAX_ATTEMPTS attempts"
              exit 1
            fi
            echo "Image not available yet, retrying in 30s... (attempt $ATTEMPT/$MAX_ATTEMPTS)"
            sleep 30
          done

      - name: Stop existing container
        run: |
          docker stop azure-ai-platform-staging || true
          docker rm azure-ai-platform-staging || true
        continue-on-error: true

      - name: Start new container
        run: |
          docker run -d \
            --name azure-ai-platform-staging \
            -p 8001:8000 \
            --restart unless-stopped \
            -e AZURE_OPENAI_ENDPOINT=${{ secrets.AZURE_OPENAI_ENDPOINT }} \
            -e AZURE_OPENAI_API_KEY=${{ secrets.AZURE_OPENAI_API_KEY }} \
            -e AZURE_OPENAI_DEPLOYMENT_NAME=${{ secrets.AZURE_OPENAI_DEPLOYMENT_NAME }} \
            -e AZURE_SEARCH_ENDPOINT=${{ secrets.AZURE_SEARCH_ENDPOINT }} \
            -e AZURE_SEARCH_API_KEY=${{ secrets.AZURE_SEARCH_API_KEY }} \
            -e AZURE_SEARCH_INDEX_NAME=${{ secrets.AZURE_SEARCH_INDEX_NAME }} \
            -e DEBUG=false \
            -e LOG_LEVEL=INFO \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - name: Health check
        run: |
          echo "Waiting for service to be healthy..."
          sleep 30

          # Check health endpoint
          MAX_ATTEMPTS=10
          ATTEMPT=0
          while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
            if curl -f http://localhost:8001/health; then
              echo "Health check passed!"
              exit 0
            fi
            ATTEMPT=$((ATTEMPT + 1))
            echo "Health check attempt $ATTEMPT failed. Retrying..."
            sleep 10
          done

          echo "Health check failed after $MAX_ATTEMPTS attempts"
          exit 1

      - name: Rollback on failure
        if: failure()
        run: |
          echo "Deployment failed. Rolling back..."
          docker stop azure-ai-platform-staging
          docker rm azure-ai-platform-staging
          echo "Rollback completed"

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: production
      url: https://example.com
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set lowercase image name
        # GitHub Actions expressions have no tolower() function; ghcr.io
        # requires a lowercase image name, so compute it in the shell.
        run: echo "IMAGE_NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Pull versioned image
        run: |
          # Retry: docker-build.yml runs concurrently on the same tag push
          # and may not have finished pushing this version yet.
          MAX_ATTEMPTS=10
          ATTEMPT=0
          until docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}; do
            ATTEMPT=$((ATTEMPT + 1))
            if [ $ATTEMPT -ge $MAX_ATTEMPTS ]; then
              echo "Image not available after $MAX_ATTEMPTS attempts"
              exit 1
            fi
            echo "Image not available yet, retrying in 30s... (attempt $ATTEMPT/$MAX_ATTEMPTS)"
            sleep 30
          done

      - name: Backup current deployment
        run: |
          if docker ps -q -f name=azure-ai-platform-prod; then
            docker commit azure-ai-platform-prod backup-azure-ai-platform-${{ github.sha }}
            docker stop azure-ai-platform-prod
          fi

      - name: Deploy new version
        run: |
          docker run -d \
            --name azure-ai-platform-prod \
            -p 8000:8000 \
            --restart unless-stopped \
            -e AZURE_OPENAI_ENDPOINT=${{ secrets.AZURE_OPENAI_ENDPOINT }} \
            -e AZURE_OPENAI_API_KEY=${{ secrets.AZURE_OPENAI_API_KEY }} \
            -e AZURE_OPENAI_DEPLOYMENT_NAME=${{ secrets.AZURE_OPENAI_DEPLOYMENT_NAME }} \
            -e AZURE_SEARCH_ENDPOINT=${{ secrets.AZURE_SEARCH_ENDPOINT }} \
            -e AZURE_SEARCH_API_KEY=${{ secrets.AZURE_SEARCH_API_KEY }} \
            -e AZURE_SEARCH_INDEX_NAME=${{ secrets.AZURE_SEARCH_INDEX_NAME }} \
            -e DEBUG=false \
            -e LOG_LEVEL=WARNING \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}

      - name: Health check
        run: |
          echo "Waiting for service to be healthy..."
          sleep 45

          # Check health endpoint
          MAX_ATTEMPTS=15
          ATTEMPT=0
          while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
            if curl -f http://localhost:8000/health; then
              echo "Production health check passed!"
              exit 0
            fi
            ATTEMPT=$((ATTEMPT + 1))
            echo "Health check attempt $ATTEMPT failed. Retrying..."
            sleep 10
          done

          echo "Production health check failed after $MAX_ATTEMPTS attempts"
          exit 1

      - name: Rollback on failure
        if: failure()
        run: |
          echo "Production deployment failed. Rolling back..."
          docker stop azure-ai-platform-prod
          docker rm azure-ai-platform-prod
          docker run -d \
            --name azure-ai-platform-prod \
            -p 8000:8000 \
            --restart unless-stopped \
            backup-azure-ai-platform-${{ github.sha }}
          echo "Production rollback completed"

      - name: Notify deployment success
        if: success()
        run: |
          echo "Production deployment successful! Version: ${{ steps.version.outputs.version }}"

  notify:
    name: Notify Deployment Status
    runs-on: ubuntu-latest
    needs: [deploy-staging, deploy-production]
    if: always()
    steps:
      - name: Check deployment status
        run: |
          if [ "${{ needs.deploy-staging.result }}" == "success" ]; then
            echo "Staging deployment: SUCCESS"
          else
            echo "Staging deployment: FAILED"
          fi

          if [ "${{ needs.deploy-production.result }}" == "success" ]; then
            echo "Production deployment: SUCCESS"
          elif [ "${{ needs.deploy-production.result }}" == "skipped" ]; then
            echo "Production deployment: SKIPPED"
          else
            echo "Production deployment: FAILED"
          fi