name: Build and Push Docker Images

on:
  push:
    branches: [main, develop]
    tags:
      - 'v*'
  pull_request:
    branches: [main, develop]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/${{ tolower(github.event.repository.name) }}

jobs:
  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image-digest: ${{ steps.build.outputs.digest }}
      image-tag: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VERSION=${{ github.ref_name }}
            VCS_REF=${{ github.sha }}
          platforms: linux/amd64,linux/arm64

      - name: Image digest
        run: |
          echo "Image digest: ${{ steps.build.outputs.digest }}"
          echo "Image tag: ${{ steps.meta.outputs.tags }}"

  scan-image:
    name: Scan Docker Image for Vulnerabilities
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name != 'pull_request'
    steps:
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ needs.build-and-push.outputs.image-tag }}
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-results.sarif'

  test-image:
    name: Test Docker Image
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull Docker image
        run: |
          docker pull ${{ needs.build-and-push.outputs.image-tag }}

      - name: Test Docker image
        run: |
          # Run container in detached mode
          CONTAINER_ID=$(docker run -d \
            -p 8000:8000 \
            -e DEBUG=true \
            -e LOG_LEVEL=INFO \
            ${{ needs.build-and-push.outputs.image-tag }})

          # Wait for container to be healthy
          echo "Waiting for container to be healthy..."
          sleep 30

          # Check if container is running
          docker ps -a | grep $CONTAINER_ID

          # Test health endpoint
          echo "Testing health endpoint..."
          curl -f http://localhost:8000/health || exit 1

          # Test API endpoints
          echo "Testing API endpoints..."
          curl -f http://localhost:8000/api || exit 1

          # Clean up
          docker stop $CONTAINER_ID
          docker rm $CONTAINER_ID

          echo "Docker image test passed!"

      - name: Check image size
        run: |
          IMAGE_SIZE=$(docker images ${{ needs.build-and-push.outputs.image-tag }} --format "{{.Size}}")
          echo "Docker image size: $IMAGE_SIZE"

          # Check if image size is under 500MB (approximate check)
          SIZE_BYTES=$(docker images ${{ needs.build-and-push.outputs.image-tag }} --format "{{.Size}}" | sed 's/MB//' | sed 's/GB/*1024/' | bc)
          if [ $SIZE_BYTES -gt 512 ]; then
            echo "Warning: Image size exceeds 500MB"
          fi