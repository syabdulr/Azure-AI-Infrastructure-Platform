name: Build and Push Docker Images

on:
  push:
    branches: [main, develop]
    tags:
      - 'v*'
  pull_request:
    branches: [main, develop]

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image-digest: ${{ steps.build.outputs.digest }}
      image-tag: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set lowercase image name
        # GitHub Actions expressions have no tolower() function; ghcr.io
        # requires a lowercase image name, so compute it in the shell.
        run: echo "IMAGE_NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VERSION=${{ github.ref_name }}
            VCS_REF=${{ github.sha }}
          platforms: linux/amd64,linux/arm64

      - name: Image digest
        run: |
          echo "Image digest: ${{ steps.build.outputs.digest }}"
          echo "Image tag: ${{ steps.meta.outputs.tags }}"

  scan-image:
    name: Scan Docker Image for Vulnerabilities
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Set lowercase image name
        # steps.meta.outputs.tags (aliased as image-tag) is a multi-line,
        # multi-tag string — not a valid single image reference. Build one
        # concrete tag instead of reusing that output directly.
        run: echo "IMAGE_NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-results.sarif'

  test-image:
    name: Test Docker Image
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set lowercase image name
        # steps.meta.outputs.tags (aliased as image-tag) is a multi-line,
        # multi-tag string — not a valid single image reference. Build one
        # concrete tag instead of reusing that output directly.
        run: echo "IMAGE_NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull Docker image
        run: |
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}

      - name: Test Docker image
        run: |
          # Run container in detached mode
          CONTAINER_ID=$(docker run -d \
            -p 8000:8000 \
            -e DEBUG=true \
            -e LOG_LEVEL=INFO \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }})

          # Wait for container to be healthy
          echo "Waiting for container to be healthy..."
          sleep 30

          # Check if container is running
          docker ps -a | grep $CONTAINER_ID

          # Test health endpoint
          echo "Testing health endpoint..."
          curl -f http://localhost:8000/health || exit 1

          # Test API docs endpoint (FastAPI's built-in Swagger UI)
          echo "Testing API docs endpoint..."
          curl -f http://localhost:8000/docs || exit 1

          # Clean up
          docker stop $CONTAINER_ID
          docker rm $CONTAINER_ID

          echo "Docker image test passed!"

      - name: Check image size
        run: |
          IMAGE_REF="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}"
          IMAGE_SIZE=$(docker images "$IMAGE_REF" --format "{{.Size}}")
          echo "Docker image size: $IMAGE_SIZE"

          # Check if image size is under 500MB (approximate check)
          SIZE_BYTES=$(docker images "$IMAGE_REF" --format "{{.Size}}" | sed 's/MB//' | sed 's/GB/*1024/' | bc)
          if [ $SIZE_BYTES -gt 512 ]; then
            echo "Warning: Image size exceeds 500MB"
          fi

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    # A needs: dependency (not a separate workflow racing this one) guarantees
    # the image this job pulls is the one build-and-push just finished pushing.
    needs: [build-and-push, test-image]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment:
      name: staging
      url: https://staging.example.com
    steps:
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lowercase image name
        run: echo "IMAGE_NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Pull latest image
        run: |
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - name: Stop existing container
        run: |
          docker stop azure-ai-platform-staging || true
          docker rm azure-ai-platform-staging || true
        continue-on-error: true

      - name: Start new container
        run: |
          docker run -d \
            --name azure-ai-platform-staging \
            -p 8001:8000 \
            --restart unless-stopped \
            -e AZURE_OPENAI_ENDPOINT=${{ secrets.AZURE_OPENAI_ENDPOINT }} \
            -e AZURE_OPENAI_API_KEY=${{ secrets.AZURE_OPENAI_API_KEY }} \
            -e AZURE_OPENAI_DEPLOYMENT_NAME=${{ secrets.AZURE_OPENAI_DEPLOYMENT_NAME }} \
            -e AZURE_SEARCH_ENDPOINT=${{ secrets.AZURE_SEARCH_ENDPOINT }} \
            -e AZURE_SEARCH_API_KEY=${{ secrets.AZURE_SEARCH_API_KEY }} \
            -e AZURE_SEARCH_INDEX_NAME=${{ secrets.AZURE_SEARCH_INDEX_NAME }} \
            -e DEBUG=false \
            -e LOG_LEVEL=INFO \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - name: Health check
        run: |
          echo "Waiting for service to be healthy..."
          sleep 15

          MAX_ATTEMPTS=10
          ATTEMPT=0
          while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
            if curl -f http://localhost:8001/health; then
              echo "Health check passed!"
              exit 0
            fi
            ATTEMPT=$((ATTEMPT + 1))
            echo "Health check attempt $ATTEMPT failed. Retrying..."
            sleep 10
          done

          echo "Health check failed after $MAX_ATTEMPTS attempts"
          exit 1

      - name: Rollback on failure
        if: failure()
        run: |
          echo "Deployment failed. Rolling back..."
          docker stop azure-ai-platform-staging || true
          docker rm azure-ai-platform-staging || true
          echo "Rollback completed"